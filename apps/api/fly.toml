# Qreative Spaces — API deploy config for Fly.io
#
# Run all fly commands from inside apps/api/ (or pass -c apps/api/fly.toml).
# Build context = this folder. Dockerfile lives next to this file.

app = "spaces-api"
primary_region = "jnb"  # Johannesburg — ~50ms to Nairobi. Use "fra" if jnb is congested.

[build]
  dockerfile = "Dockerfile"

# Runs once before the new release takes traffic. Safe to re-run — `migrate
# deploy` is a no-op when there's nothing pending.
[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  PORT = "4000"
  NODE_ENV = "production"
  API_GLOBAL_PREFIX = "api"

# Secrets are NOT set here — use `fly secrets set` so they never hit git.
# Required:   DATABASE_URL, JWT_SECRET, CORS_ORIGINS
# Optional:   MPESA_*, STRIPE_SECRET_KEY, SMTP_*

[http_service]
  internal_port = 4000
  force_https = true

  # M-Pesa callbacks fail if there's no machine running — keep one warm.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"  # bump to 1gb if Prisma OOMs during migrations
