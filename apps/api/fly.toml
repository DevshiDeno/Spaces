# fly.toml app configuration file generated for spaces-api on 2026-05-14T14:19:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'spaces-api'
primary_region = 'jnb'
# Run all fly commands from inside apps/api/ (or pass -c apps/api/fly.toml).
# Build context = this folder. Dockerfile lives next to this file.

app = "spaces-api"
primary_region = "jnb"  # Johannesburg — ~50ms to Nairobi. Use "fra" if jnb is congested.

[build]
  dockerfile = 'Dockerfile'

# Runs once before the new release takes traffic. Safe to re-run — `migrate
# deploy` is a no-op when there's nothing pending.
[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  API_GLOBAL_PREFIX = 'api'
  NODE_ENV = 'production'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
