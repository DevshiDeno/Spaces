app = 'spaces-api'
primary_region = 'jnb'

# Deploy from the repo root with `fly deploy -c apps/api/fly.toml` so the build
# context is the monorepo root — which is what this Dockerfile expects.
[build]
dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  API_GLOBAL_PREFIX = 'api'
  NODE_ENV = 'production'
  PORT = '4000'
  CORS_ORIGINS = 'https://www.spaces.co.ke'
  WEB_APP_URL = 'https://www.spaces.co.ke'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
